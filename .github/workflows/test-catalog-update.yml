name: Test KEXP Catalog Update

on:
  workflow_dispatch: # Manual trigger only

concurrency:
  group: test-catalog-update
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    environment: "weekly update"
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install spotipy requests python-dateutil
        
    - name: Create config.json from secrets
      env:
        SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
        SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
        SPOTIPY_REDIRECT_URI: ${{ vars.SPOTIPY_REDIRECT_URI }}
        SPOTIFY_USERNAME: ${{ vars.SPOTIFY_USERNAME }}
        TOP_N: ${{ vars.TOP_N }}
        PIVOT: ${{ vars.PIVOT }}
      run: |
        cat > config.json << EOF
        {
            "environment": {
                "SPOTIPY_CLIENT_ID": "$SPOTIPY_CLIENT_ID",
                "SPOTIPY_CLIENT_SECRET": "$SPOTIPY_CLIENT_SECRET",
                "SPOTIPY_REDIRECT_URI": "$SPOTIPY_REDIRECT_URI"
            },
            "spotify_username": "$SPOTIFY_USERNAME",
            "playlist_name": "github_test",
            "daysToParse": 3,
            "topN": ${TOP_N:-100},
            "pivot": "${PIVOT:-track}"
        }
        EOF
        
    - name: Restore API cache
      uses: actions/cache@v4
      with:
        path: cache/
        key: kexp-api-cache-test-${{ github.run_id }}
        restore-keys: |
          kexp-api-cache-test-

    - name: Pre-seed Spotify token cache
      env:
        SPOTIFY_USERNAME: ${{ vars.SPOTIFY_USERNAME }}
        SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      run: |
        cat > ".cache-${SPOTIFY_USERNAME}" << EOF
        {
          "access_token": "placeholder",
          "token_type": "Bearer",
          "expires_in": 3600,
          "refresh_token": "${SPOTIFY_REFRESH_TOKEN}",
          "scope": "playlist-modify-public playlist-modify-private",
          "expires_at": 0
        }
        EOF
    - name: Run KEXP catalog processing
      run: python processCatalog.py --config config.json

    - name: Prune cache files older than retention period
      env:
        CACHE_RETENTION_DAYS: ${{ vars.CACHE_RETENTION_DAYS || '90' }}
      run: |
        python3 - <<'EOF'
        import os, datetime
        retention_days = int(os.environ.get('CACHE_RETENTION_DAYS', 90))
        cutoff = datetime.datetime.utcnow() - datetime.timedelta(days=retention_days)
        deleted = 0
        cache_dir = 'cache'
        if os.path.isdir(cache_dir):
            for f in os.listdir(cache_dir):
                # Cache files are named YYYYMMDD.json by processCatalog.py
                if f.endswith('.json') and len(f) == 13:
                    try:
                        date = datetime.datetime.strptime(f[:8], '%Y%m%d')
                        if date < cutoff:
                            os.remove(os.path.join(cache_dir, f))
                            deleted += 1
                            print(f'Deleted {f}')
                    except ValueError:
                        pass
        print(f'Pruned {deleted} cache file(s) older than {retention_days} days')
        EOF

    - name: Clean up config file
      if: always()
      run: rm -f config.json
